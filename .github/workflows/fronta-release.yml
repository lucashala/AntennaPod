name: Fronta release

on:
  push:
    branches: [ fronta ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set version and keystore
        run: |
          cp .fronta/release.jks app/keystore
          BASE=$(sed -nE 's/^\s*versionCode ([0-9]+).*/\1/p' app/build.gradle | head -1)
          sed -i -E "0,/versionCode [0-9]+/s//versionCode $((BASE + GITHUB_RUN_NUMBER))/" app/build.gradle
          sed -i -E "0,/versionName \"([^\"]+)\"/s//versionName \"\1-fronta.$GITHUB_RUN_NUMBER\"/" app/build.gradle
      - name: Queue tests
        run: ./gradlew --console=plain :storage:database:testDebugUnitTest :net:download:service:testDebugUnitTest
      - name: Build
        run: ./gradlew --console=plain :app:assemblePlayRelease
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/play/release -name '*.apk' | head -1)
          cp "$APK" AntennaPod-fronta.apk
          gh release create "fronta-$GITHUB_RUN_NUMBER" AntennaPod-fronta.apk \
            --target "$GITHUB_SHA" --title "AntennaPod Fronta $GITHUB_RUN_NUMBER" \
            --notes "Poslední rozehraná epizoda první, ostatní podle nastaveného řazení."
