name: Fronta release

on:
  push:
    branches: [ fronta ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Signing key
        env:
          KEY_PASSWORD: ${{ secrets.FRONTA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY_PASSWORD" ]; then
            cp .fronta/release.jks app/keystore
            exit 0
          fi
          if [ ! -f .fronta/private.jks ]; then
            keytool -genkeypair -noprompt -dname "cn=AntennaPod Fronta" -alias alias \
              -keystore .fronta/private.jks -storetype PKCS12 -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" \
              -keyalg RSA -keysize 3072 -validity 15000
            git rm -q .fronta/release.jks
            git add .fronta/private.jks
            git -c user.name="fronta-release" -c user.email="fronta-release@users.noreply.github.com" \
              commit -q -m "Replace public signing key with password protected key"
            git push origin HEAD:fronta
          fi
          cp .fronta/private.jks app/keystore
          {
            echo "ORG_GRADLE_PROJECT_releaseStorePassword=$KEY_PASSWORD"
            echo "ORG_GRADLE_PROJECT_releaseKeyPassword=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Set version
        run: |
          BASE=$(sed -nE 's/^\s*versionCode ([0-9]+).*/\1/p' app/build.gradle | head -1)
          sed -i -E "0,/versionCode [0-9]+/s//versionCode $((BASE + GITHUB_RUN_NUMBER))/" app/build.gradle
          sed -i -E "0,/versionName \"([^\"]+)\"/s//versionName \"\1-fronta.$GITHUB_RUN_NUMBER\"/" app/build.gradle
      - name: Queue tests
        run: ./gradlew --console=plain :storage:database:testPlayDebugUnitTest :net:download:service:testPlayDebugUnitTest
      - name: Build
        run: ./gradlew --console=plain :app:assemblePlayRelease
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/play/release -name '*.apk' | head -1)
          cp "$APK" AntennaPod-fronta.apk
          gh release create "fronta-$GITHUB_RUN_NUMBER" AntennaPod-fronta.apk \
            --target "$GITHUB_SHA" --title "AntennaPod Fronta $GITHUB_RUN_NUMBER" \
            --notes "Poslední rozehraná epizoda první, ostatní podle nastaveného řazení."
